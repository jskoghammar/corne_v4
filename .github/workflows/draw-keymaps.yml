# Draw ZMK keymaps and generate the layer manifest keylens consumes.
#
# Layer names are NOT listed here. They come from layers.json, which is derived
# from the keymap itself -- a hand-maintained list in this file would be one
# more thing to drift out of step with the firmware.
name: Draw ZMK keymaps
on:
  workflow_dispatch:  # can be triggered manually
  push:               # automatically run on changes to following paths
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
      - "config/keymap_drawer.config.yaml"
      - "scripts/gen_layers_manifest.py"
      - ".github/workflows/draw-keymaps.yml"
      # - 'boards/*/*/*.keymap'

permissions:
  contents: write

env:
  KEYMAP_PATTERNS: "config/*.keymap"
  OUTPUT_FOLDER: "keymap-drawer"

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install keymap-drawer
        run: pip install keymap-drawer

      # Fails the build if a layer's signal stops matching its index, or if a
      # layer is held with the wrong SIG_ constant.
      - name: Check layer signals
        run: python3 scripts/gen_layers_manifest.py --check

      - name: Draw one SVG per layer and generate the manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          rm -rf "${OUTPUT_FOLDER}"
          mkdir -p "${OUTPUT_FOLDER}" "${OUTPUT_FOLDER}/img"

          python3 scripts/gen_layers_manifest.py --commit "${GITHUB_SHA}"

          # Every layer gets drawn, including Base. layers.json deliberately
          # lists only the signalled layers, so the draw list comes from the
          # keymap parse directly rather than from the manifest.
          layers=()
          while IFS= read -r layer; do
            [[ -n "${layer}" ]] && layers+=("${layer}")
          done < <(python3 scripts/gen_layers_manifest.py --layer-names)
          if [[ ${#layers[@]} -eq 0 ]]; then
            echo "No layers found in the keymap."
            exit 1
          fi
          echo "Drawing layers: ${layers[*]}"

          drawer_config="config/keymap_drawer.config.yaml"

          keymaps=( ${KEYMAP_PATTERNS} )
          if [[ ${#keymaps[@]} -eq 0 ]]; then
            echo "No keymaps matched: ${KEYMAP_PATTERNS}"
            exit 1
          fi

          for keymap_file in "${keymaps[@]}"; do
            keymap_name="$(basename "${keymap_file%.keymap}")"
            parsed_yaml="${OUTPUT_FOLDER}/${keymap_name}.yaml"
            keymap -c "${drawer_config}" parse -z "${keymap_file}" > "${parsed_yaml}"

            for layer in "${layers[@]}"; do
              layer_slug="$(echo "${layer}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]_-')"
              output_svg="${OUTPUT_FOLDER}/img/${keymap_name}-${layer_slug}.svg"
              keymap -c "${drawer_config}" draw -s "${layer}" -- "${parsed_yaml}" > "${output_svg}"
            done
          done

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Draw keymaps"
          file_pattern: "keymap-drawer/**"
